 </g>
</defs>
<rect width="1400" height="1400" fill="#eef2f6"/>
<text x="80" y="52" font-size="13" font-weight="700" letter-spacing="2" fill="#15803d">ADB OPTIMIZER / COMBINACIÓN 1 + 2</text>
<text x="80" y="104" font-size="36" font-weight="700" fill="#0f172a">Un resumen claro. El detalle, por pestañas.</text>
<text x="80" y="142" font-size="18" fill="#52657a">Dos estados del mismo Inicio: no son pantallas adicionales ni diseños separados.</text>

<g transform="translate(160 240)">
 <text y="-32" font-size="21" fill="#0f172a" font-weight="700">Vista inicial · Dispositivo</text>
