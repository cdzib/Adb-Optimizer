 <text x="24" y="436" font-size="14" font-weight="700" fill="#4ade80">Dispositivo</text>
 <text x="134" y="436" class="body">Sistema</text><text x="228" y="436" class="body">CPU</text><text x="286" y="436" class="body">Batería</text><text x="356" y="436" class="body">Memoria</text>
 <rect x="24" y="455" width="90" height="3" rx="1.5" fill="#4ade80"/>
 <text x="24" y="500" class="label">INFORMACIÓN DEL EQUIPO</text>
 <rect x="24" y="520" width="392" height="228" rx="20" fill="#141e29"/>
 <text x="44" y="556" class="muted">Fabricante</text><text x="396" y="556" text-anchor="end" class="title">Samsung</text>
 <path d="M44 576h352" class="line"/>
 <text x="44" y="606" class="muted">Modelo</text><text x="396" y="606" text-anchor="end" class="title">SM-A356E</text>
 <path d="M44 626h352" class="line"/>
 <text x="44" y="656" class="muted">Tipo de equipo</text><text x="396" y="656" text-anchor="end" class="body">Teléfono</text>
 <path d="M44 676h352" class="line"/>
 <text x="44" y="706" class="muted">Conexión</text><text x="396" y="706" text-anchor="end" class="body">Local</text>
 <text x="24" y="780" class="muted">Los datos técnicos se agrupan por categoría.</text>
 <text y="930" font-size="18" font-weight="700" fill="#0f172a">De la opción 2: el resumen.</text>
 <text y="962" class="note">Batería y RAM se consultan de un vistazo.</text>
 <text y="990" class="note">Tocar una tarjeta selecciona su pestaña.</text>
</g>

<g transform="translate(800 240)">
 <text y="-32" font-size="21" fill="#0f172a" font-weight="700">Mismo Inicio · CPU seleccionada</text>
 <use href="#base"/>
 <text x="24" y="436" class="body">Dispositivo</text><text x="134" y="436" class="body">Sistema</text>
 <text x="228" y="436" font-size="14" font-weight="700" fill="#4ade80">CPU</text><text x="286" y="436" class="body">Batería</text><text x="356" y="436" class="body">Memoria</text>
 <rect x="214" y="455" width="58" height="3" rx="1.5" fill="#4ade80"/>
 <text x="24" y="500" class="label">PROCESADOR</text>
 <rect x="24" y="520" width="392" height="120" rx="20" fill="#17212e"/>
 <text x="44" y="552" class="body">CPU en uso</text><text x="44" y="596" class="value">18%</text><use href="#chip" x="352" y="548" class="icon"/>
 <rect x="44" y="615" width="352" height="6" rx="3" fill="#293544"/><rect x="44" y="615" width="64" height="6" rx="3" fill="#4ade80"/>
 <rect x="24" y="656" width="392" height="92" rx="20" fill="#141e29"/>
 <text x="44" y="692" class="muted">Arquitectura</text><text x="396" y="692" text-anchor="end" class="title">arm64-v8a</text>
 <text x="44" y="726" class="muted">Carga del sistema</text><text x="396" y="726" text-anchor="end" class="title">0.42</text>
 <text x="24" y="780" class="muted">Solo cambia el contenido bajo las pestañas.</text>
 <text y="930" font-size="18" font-weight="700" fill="#0f172a">De la opción 1: el detalle organizado.</text>
 <text y="962" class="note">Cambias de categoría sin salir de Inicio.</text>
 <text y="990" class="note">Las pestañas deslizan en pantallas pequeñas.</text>
</g>
<path d="M648 680h104m-10-8 10 8-10 8" stroke="#15803d" stroke-width="2" fill="none"/>
<text x="700" y="710" text-anchor="middle" font-size="12" fill="#52657a">Tocar CPU</text>
<rect x="80" y="1300" width="1240" height="64" rx="16" fill="#dfeae3"/>
<text x="104" y="1327" font-size="15" fill="#245438">Dispositivo · Sistema · CPU · Batería · Memoria (RAM + almacenamiento). Sin duplicar una lista de categorías.</text>
<text x="104" y="1351" font-size="14" fill="#245438">Propuesta SVG con datos ilustrativos. La app sigue sin cambios; se conservan el tema y las herramientas según el destino.</text>
</svg>
