  <text x="24" y="146" class="heading">Inicio</text><path d="M403 132a9 9 0 1 0 1 11m-1-19v8h-8" class="icon"/>
  <text x="24" y="176" class="body">Samsung Galaxy A35</text>
  <rect x="24" y="194" width="178" height="26" rx="13" fill="#1d2936"/><text x="36" y="212" class="muted">Shizuku · Revisar acceso</text><use href="#chevron" x="185" y="202" class="icon"/>
  <text x="24" y="258" class="label">DE UN VISTAZO</text>
