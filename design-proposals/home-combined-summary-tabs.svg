<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
<title id="title">Inicio combinado: resumen y pestañas</title>
<desc id="desc">Dos estados del mismo Inicio: pestaña Dispositivo y pestaña CPU. El resumen de batería y RAM se mantiene arriba. Los accesos de categorías se convierten en pestañas, sin duplicar menús.</desc>
<defs>
 <style>text{font-family:Arial,Helvetica,sans-serif}.heading{font-size:27px;font-weight:700;fill:#e7eef7}.title{font-size:17px;font-weight:700;fill:#e7eef7}.body{font-size:14px;fill:#a5b4c7}.muted{font-size:13px;fill:#8ba0b8}.label{font-size:11px;font-weight:700;letter-spacing:1.2px;fill:#4ade80}.value{font-size:32px;font-weight:700;fill:#e7eef7}.note{font-size:16px;fill:#52657a}.line{stroke:#293544;fill:none}.icon{stroke:#4ade80;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
