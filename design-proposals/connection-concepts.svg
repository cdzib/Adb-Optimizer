<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
<defs>
 <style>text{font-family:Arial,Helvetica,sans-serif} .h{font-size:26px;font-weight:700;fill:#e7eef7}.body{font-size:14px;fill:#a5b4c7}.title{font-size:17px;font-weight:700;fill:#e7eef7}.label{font-size:12px;letter-spacing:1.5px;font-weight:700;fill:#4ade80}.dark{fill:#052e16;font-size:16px;font-weight:700}.muted{fill:#8ba0b8;font-size:13px}.line{stroke:#293544;stroke-width:1;fill:none}.icon{stroke:#4ade80;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
 <g id="tv"><rect x="0" y="0" width="38" height="26" rx="5"/><path d="M19 26v7m-9 0h18"/></g>
 <g id="phone"><rect width="20" height="34" rx="5"/><path d="M7 29h6"/></g>
 <g id="arrow"><path d="m7 0-7 7 7 7M0 7h18"/></g>
 <g id="chevron"><path d="m0 0 5 5-5 5"/></g>
</defs>
<rect width="1440" height="1120" fill="#eef2f6"/>
<text x="60" y="58" font-size="14" fill="#15803d" font-weight="700" letter-spacing="3">ADB OPTIMIZER / EXPLORACIÓN VISUAL</text>
<text x="60" y="104" font-size="34" fill="#0f172a" font-weight="700">Una conexión más simple. Tres direcciones.</text>
<text x="60" y="138" font-size="17" fill="#52657a">Misma identidad del proyecto · Menos ruido · Una acción principal por pantalla</text>

<!-- Concept one -->
<g transform="translate(60 184)">
 <text x="0" y="0" font-size="20" font-weight="700" fill="#0f172a">01 / Asistente guiado</text>
 <rect x="264" y="-20" width="120" height="26" rx="13" fill="#d8f4e2"/><text x="279" y="-3" font-size="11" font-weight="700" fill="#15803d">RECOMENDADO</text>
 <rect y="24" width="400" height="778" rx="36" fill="#0b0f14" stroke="#263342" stroke-width="2"/>
 <text x="28" y="56" class="body">9:41</text><text x="320" y="56" class="body">● ▰</text>
 <use href="#arrow" x="28" y="86" class="icon"/><text x="65" y="99" class="title">Nuevo dispositivo</text><circle cx="365" cy="93" r="10" class="line"/><text x="363" y="98" class="muted">?</text>
 <rect x="24" y="126" width="112" height="4" rx="2" fill="#4ade80"/><rect x="144" y="126" width="112" height="4" rx="2" fill="#253140"/><rect x="264" y="126" width="112" height="4" rx="2" fill="#253140"/>
 <text x="24" y="164" class="label">PASO 1 DE 3</text>
 <text x="24" y="204" class="h">¿Qué quieres conectar?</text>
 <text x="24" y="232" class="body">Te guiaremos con el método adecuado.</text>
 <rect x="24" y="268" width="352" height="116" rx="20" fill="#12241f" stroke="#4ade80" stroke-width="1.5"/>
 <rect x="44" y="292" width="56" height="56" rx="16" fill="#1b3a2c"/><use href="#tv" x="53" y="306" class="icon"/>
 <text x="116" y="309" class="title">Android TV / TV Box</text><text x="116" y="335" class="body">Vinculación con código</text>
 <circle cx="348" cy="326" r="9" stroke="#4ade80" fill="none"/><circle cx="348" cy="326" r="4" fill="#4ade80"/>
 <rect x="24" y="400" width="352" height="116" rx="20" fill="#151e29" stroke="#293544"/>
 <rect x="44" y="424" width="56" height="56" rx="16" fill="#1e2b39"/><use href="#phone" x="62" y="435" class="icon"/>
 <text x="116" y="443" class="title">Teléfono o tablet</text><text x="116" y="469" class="body">Vinculación con QR</text><circle cx="348" cy="458" r="9" class="line"/>
 <path d="M24 552h352" class="line"/>
 <text x="24" y="586" class="title">¿Ya lo habías vinculado?</text><text x="24" y="614" class="body">Buscar en mi red</text><use href="#chevron" x="360" y="602" class="icon"/>
 <text x="24" y="674" class="muted">Ambos equipos deben estar en la misma Wi-Fi.</text>
 <rect x="24" y="700" width="352" height="56" rx="16" fill="#4ade80"/><text x="156" y="735" class="dark">Continuar</text>
 <rect x="154" y="784" width="92" height="4" rx="2" fill="#596675"/>
 <text x="0" y="842" font-size="16" fill="#0f172a" font-weight="700">Menos decisiones, más acompañamiento.</text>
 <text x="0" y="870" font-size="14" fill="#52657a">Eliges equipo → preparas → conectas.</text>
 <text x="0" y="894" font-size="14" fill="#52657a">Atrás vuelve al paso anterior.</text>
</g>

<!-- Concept two -->
<g transform="translate(520 184)">
 <text y="0" font-size="20" font-weight="700" fill="#0f172a">02 / Centro de dispositivos</text>
 <rect y="24" width="400" height="778" rx="36" fill="#0b0f14" stroke="#263342" stroke-width="2"/>
 <text x="28" y="56" class="body">9:41</text><text x="320" y="56" class="body">● ▰</text>
 <text x="24" y="104" class="label">TU ESPACIO DE TRABAJO</text><text x="24" y="148" class="h">Dispositivos</text>
 <circle cx="353" cy="133" r="23" fill="#17212e"/><text x="344" y="141" font-size="27" fill="#4ade80">+</text>
 <text x="24" y="180" class="body">Administra tus equipos desde un solo lugar.</text>
 <rect x="24" y="212" width="352" height="100" rx="20" fill="#17212e"/>
 <use href="#phone" x="48" y="243" class="icon"/><text x="88" y="248" class="title">Este teléfono</text><text x="88" y="274" class="body">Destino activo · Local</text><circle cx="346" cy="260" r="5" fill="#4ade80"/>
 <text x="24" y="356" class="label">DISPOSITIVOS REMOTOS</text>
 <rect x="24" y="380" width="352" height="208" rx="20" fill="#111a24" stroke="#293544"/>
 <circle cx="200" cy="438" r="32" fill="#1c2c32"/><use href="#tv" x="181" y="424" class="icon"/>
 <text x="90" y="500" class="title">Tu próximo equipo, aquí</text><text x="65" y="529" class="body">Conecta una TV, un teléfono o una tablet.</text><text x="93" y="553" class="body">Sin cables. Todo bajo tu control.</text>
 <rect x="24" y="612" width="352" height="56" rx="16" fill="#4ade80"/><text x="116" y="647" class="dark">+ Conectar equipo</text>
 <text x="24" y="712" class="muted">Vinculados anteriormente</text><text x="24" y="740" class="body">Tus equipos recientes aparecerán aquí.</text>
 <rect x="154" y="784" width="92" height="4" rx="2" fill="#596675"/>
 <text x="0" y="842" font-size="16" fill="#0f172a" font-weight="700">Una vista ordenada de todo tu entorno.</text>
 <text x="0" y="870" font-size="14" fill="#52657a">Separa el teléfono local de los remotos.</text>
 <text x="0" y="894" font-size="14" fill="#52657a">Conectar abre un flujo independiente.</text>
</g>

<!-- Concept three -->
<g transform="translate(980 184)">
 <text y="0" font-size="20" font-weight="700" fill="#0f172a">03 / Conexión directa</text>
 <rect y="24" width="400" height="778" rx="36" fill="#f6f8fb" stroke="#cbd5e1" stroke-width="2"/>
 <text x="28" y="56" font-size="14" fill="#52657a">9:41</text><text x="320" y="56" font-size="14" fill="#52657a">● ▰</text>
 <use href="#arrow" x="28" y="86" stroke="#0f172a" stroke-width="2" fill="none"/><text x="65" y="99" font-size="17" font-weight="700" fill="#0f172a">Conectar</text><text x="326" y="99" font-size="14" fill="#15803d">Ayuda</text>
 <text x="24" y="166" font-size="27" font-weight="700" fill="#0f172a">Encuentra tu equipo.</text><text x="24" y="196" font-size="14" fill="#52657a">Conexión segura, sin complicaciones.</text>
 <rect x="24" y="228" width="352" height="44" rx="22" fill="#e5ebf1"/><rect x="28" y="232" width="168" height="36" rx="18" fill="#fff"/><text x="82" y="255" font-size="14" font-weight="700" fill="#15803d">En mi red</text><text x="229" y="255" font-size="14" fill="#52657a">Primera vez</text>
 <rect x="24" y="296" width="352" height="230" rx="24" fill="#fff" stroke="#e0e7ee"/>
 <circle cx="200" cy="365" r="38" fill="#e8f5ec"/><use href="#tv" x="181" y="350" stroke="#15803d" stroke-width="2" fill="none"/>
 <text x="94" y="432" font-size="18" fill="#0f172a" font-weight="700">Busca en tu Wi-Fi</text><text x="58" y="461" font-size="14" fill="#52657a">Para equipos que ya están vinculados.</text><circle cx="125" cy="494" r="4" fill="#15803d"/><text x="138" y="499" font-size="13" fill="#15803d">Búsqueda disponible</text>
 <rect x="24" y="550" width="352" height="56" rx="16" fill="#15803d"/><text x="124" y="585" font-size="16" font-weight="700" fill="#fff">Buscar dispositivos</text>
 <text x="24" y="654" font-size="12" letter-spacing="1" font-weight="700" fill="#52657a">OTRAS OPCIONES</text>
 <path d="M24 674h352" stroke="#dce4ec"/>
 <text x="24" y="709" font-size="15" fill="#0f172a">Conectar por dirección IP</text><use href="#chevron" x="360" y="698" stroke="#52657a" stroke-width="2" fill="none"/>
 <path d="M24 730h352" stroke="#dce4ec"/><text x="24" y="761" font-size="13" fill="#52657a">¿No aparece? Prueba la vinculación inicial.</text>
 <rect x="154" y="784" width="92" height="4" rx="2" fill="#b0bdcb"/>
 <text x="0" y="842" font-size="16" fill="#0f172a" font-weight="700">Minimalista, clara y rápida.</text>
 <text x="0" y="870" font-size="14" fill="#52657a">Dos contextos; sin cuatro pestañas a la vez.</text>
 <text x="0" y="894" font-size="14" fill="#52657a">También adaptable al tema oscuro.</text>
</g>
<text x="60" y="1080" font-size="13" fill="#64748b">Mockups conceptuales · No son capturas de la app · El tema claro/oscuro es independiente de la propuesta elegida.</text>
</svg>
