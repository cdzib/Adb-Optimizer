<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc">
<title id="title">Ejemplo de vinculación con QR para ADB Optimizer</title>
<desc id="desc">Segundo y último paso del asistente. El equipo remoto escanea el QR mostrado en este teléfono. Código ilustrativo, no utilizable para vincular.</desc>
<defs>
 <style>text{font-family:Arial,Helvetica,sans-serif}.heading{font-size:26px;font-weight:700;fill:#e7eef7}.title{font-size:17px;font-weight:700;fill:#e7eef7}.body{font-size:14px;fill:#a5b4c7}.muted{font-size:13px;fill:#8ba0b8}.label{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#4ade80}.note{font-size:16px;fill:#52657a}.icon{stroke:#4ade80;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
 <g id="finder"><rect width="49" height="49" fill="#0b0f14"/><rect x="7" y="7" width="35" height="35" fill="white"/><rect x="14" y="14" width="21" height="21" fill="#0b0f14"/></g>
 <pattern id="modules" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 0h14v7H7v7H0zM21 7h7v14H14v-7h7zM0 21h7v7H0zM14 0h7v7h-7z" fill="#0b0f14"/></pattern>
</defs>
<rect width="1120" height="1120" fill="#eef2f6"/>
<text x="56" y="52" font-size="13" font-weight="700" letter-spacing="2" fill="#15803d">ADB OPTIMIZER / EJEMPLO QR · PROPUESTA 1 + 2</text>
<text x="56" y="98" font-size="32" font-weight="700" fill="#0f172a">Escanea. Vincula. Listo.</text>
<text x="56" y="130" class="note">Sin pantalla de preparación: las indicaciones están junto al QR.</text>

<!-- Pantalla: segundo paso del flujo simplificado -->
<g transform="translate(56 176)">
 <rect width="400" height="880" rx="32" fill="#0b0f14" stroke="#263342" stroke-width="2"/>
 <text x="24" y="32" class="body">9:41</text><text x="326" y="32" class="body">● ▰</text>
 <path d="m32 64-8 8 8 8m-8-8h20" class="icon"/>
 <text x="64" y="80" class="title">Vincular teléfono</text>
 <circle cx="352" cy="72" r="12" stroke="#344457" fill="none"/><text x="352" y="77" text-anchor="middle" class="body">?</text>
 <rect x="24" y="108" width="172" height="4" rx="2" fill="#4ade80"/><rect x="204" y="108" width="172" height="4" rx="2" fill="#4ade80"/>
 <text x="24" y="150" class="label">PASO 2 DE 2 · VINCULACIÓN</text>
 <text x="24" y="194" class="heading">Escanea desde el otro</text>
 <text x="24" y="226" class="heading">dispositivo.</text>
 <text x="24" y="258" class="body">Este teléfono muestra el QR. El otro lo escanea.</text>

 <rect x="24" y="284" width="352" height="104" rx="16" fill="#17212e"/>
 <text x="40" y="312" class="title">En el equipo que quieres conectar</text>
 <text x="40" y="338" class="body">Depuración inalámbrica → Vincular con QR.</text>
 <text x="40" y="364" class="muted">Mantén ambos equipos en la misma Wi-Fi.</text>

 <!-- QR deliberadamente ilustrativo, sin credenciales reales -->
 <rect x="76" y="412" width="248" height="248" rx="20" fill="#fff"/>
 <g transform="translate(102 438)">
  <rect width="196" height="196" fill="url(#modules)"/>
  <rect width="63" height="63" fill="white"/><use href="#finder" x="0" y="0"/>
  <rect x="133" width="63" height="63" fill="white"/><use href="#finder" x="147" y="0"/>
  <rect y="133" width="63" height="63" fill="white"/><use href="#finder" x="0" y="147"/>
  <rect x="70" y="70" width="56" height="56" rx="8" fill="white"/>
  <rect x="78" y="78" width="40" height="40" rx="8" fill="#e6f6eb"/>
  <path d="M91 90h14v14H91zM95 107h6" stroke="#15803d" stroke-width="2" fill="none"/>
 </g>
 <circle cx="112" cy="692" r="4" fill="#4ade80"/><text x="128" y="697" class="body">Esperando que lo escanees</text>
 <text x="200" y="726" text-anchor="middle" class="muted">Mantén esta pantalla abierta.</text>
 <path d="M24 752h352" stroke="#293544"/>
 <text x="200" y="784" text-anchor="middle" font-size="14" fill="#4ade80" font-weight="700">¿No puedes escanear? Usar código</text>
 <rect x="24" y="804" width="352" height="48" rx="14" fill="none" stroke="#344457"/>
 <text x="200" y="834" text-anchor="middle" class="body">Cancelar vinculación</text>
 <rect x="152" y="864" width="96" height="4" rx="2" fill="#596675"/>
</g>

<!-- Notas de interacción, fuera de la pantalla -->
<g transform="translate(520 208)">
 <text y="0" font-size="23" font-weight="700" fill="#0f172a">Un paso, una acción.</text>
 <text y="38" class="note">El QR se genera al entrar a esta pantalla.</text>
 <text y="64" class="note">Sin un botón extra de «Generar».</text>
 <path d="M0 100h536" stroke="#cbd5e1"/>
 <text y="138" font-size="18" font-weight="700" fill="#0f172a">Instrucciones en el lugar correcto</text>
 <text y="172" class="note">Aclaramos qué equipo muestra el QR</text>
 <text y="198" class="note">y cuál debe escanearlo, sin otra pantalla.</text>
 <text y="250" font-size="18" font-weight="700" fill="#0f172a">Una salida si no hay cámara</text>
 <text y="284" class="note">«Usar código» cambia el método aquí mismo.</text>
 <text y="310" class="note">Atrás vuelve a elegir equipo.</text>
 <path d="M0 350h536" stroke="#cbd5e1"/>
 <text y="390" font-size="18" font-weight="700" fill="#0f172a">Estado visible, sin botones duplicados</text>
 <rect y="418" width="504" height="104" rx="16" fill="#dfeae3"/>
 <text x="20" y="450" font-size="15" fill="#245438">Esperando escaneo → Vinculando → Conectando</text>
 <text x="20" y="484" font-size="14" fill="#245438">Al conectar, se abre el equipo remoto.</text>
 <text y="570" font-size="18" font-weight="700" fill="#0f172a">Si vence o falla</text>
 <text y="604" class="note">Mensaje breve junto al QR y «Generar nuevo».</text>
 <text y="630" class="note">Sin sacar al usuario de esta pantalla.</text>
 <rect y="686" width="504" height="104" rx="16" fill="#fff" stroke="#d7e0e9"/>
 <text x="20" y="720" font-size="15" font-weight="700" fill="#0f172a">Propuesta visual, no implementación.</text>
 <text x="20" y="750" font-size="14" fill="#52657a">QR ilustrativo: no contiene datos de vinculación.</text>
 <text x="20" y="774" font-size="14" fill="#52657a">La app permanece sin cambios.</text>
</g>
</svg>
