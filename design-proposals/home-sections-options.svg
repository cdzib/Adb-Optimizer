<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" role="img" aria-labelledby="title desc">
<title id="title">Tres propuestas para organizar Inicio de ADB Optimizer</title>
<desc id="desc">Opción uno con pestañas por categoría; opción dos con resumen y accesos a categorías; opción tres con secciones desplegables. Datos ilustrativos, no capturas reales.</desc>
<defs>
 <style>text{font-family:Arial,Helvetica,sans-serif}.heading{font-size:27px;font-weight:700;fill:#e7eef7}.title{font-size:17px;font-weight:700;fill:#e7eef7}.body{font-size:14px;fill:#a5b4c7}.muted{font-size:13px;fill:#8ba0b8}.label{font-size:11px;letter-spacing:1.2px;font-weight:700;fill:#4ade80}.value{font-size:32px;font-weight:700;fill:#e7eef7}.note{font-size:15px;fill:#52657a}.icon{stroke:#4ade80;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.line{stroke:#293544;fill:none}</style>
 <g id="phone"><rect width="18" height="30" rx="4"/><path d="M6 25h6"/></g>
 <g id="chip"><rect x="6" y="6" width="20" height="20" rx="4"/><path d="M11 0v6m10-6v6m-10 20v6m10-6v6M0 11h6m-6 10h6m20-10h6m-6 10h6"/></g>
 <g id="battery"><rect x="0" y="6" width="28" height="18" rx="4"/><path d="M31 11v8M5 11h16v8H5z"/></g>
 <g id="memory"><rect x="0" y="7" width="32" height="18" rx="3"/><path d="M6 12v8m7-8v8m7-8v8m7-8v8M5 25v5m7-5v5m8-5v5m7-5v5"/></g>
 <g id="system"><path d="m16 1 14 8v14l-14 8-14-8V9zM2 9l14 8 14-8M16 17v14"/></g>
 <g id="chevron"><path d="m0 0 6 6-6 6"/></g>
 <g id="down"><path d="m0 0 6 6 6-6"/></g>
 <g id="refresh"><path d="M21 8a10 10 0 1 0 1 12M21 1v8h-8"/></g>
 <g id="frame">
  <rect width="440" height="884" rx="32" fill="#0b0f14" stroke="#263342" stroke-width="2"/>
  <text x="24" y="30" class="body">9:41</text><text x="365" y="30" class="body">● ▰</text>
  <rect x="16" y="50" width="408" height="52" rx="14" fill="#14241e"/>
  <use href="#phone" x="32" y="61" class="icon"/>
  <text x="66" y="72" class="label">DESTINO ACTIVO</text><text x="66" y="92" class="body">Este teléfono</text>
  <circle cx="399" cy="76" r="4" fill="#4ade80"/>
  <text x="24" y="146" class="heading">Inicio</text><use href="#refresh" x="384" y="121" class="icon"/>
  <text x="24" y="176" class="body">Samsung Galaxy A35</text>
  <rect x="24" y="194" width="143" height="26" rx="13" fill="#1d2936"/><text x="36" y="212" class="muted">Shizuku · Sin acceso</text>
  <rect y="800" width="440" height="84" rx="0" fill="#111a24"/>
  <rect x="20" y="812" width="76" height="30" rx="15" fill="#1a3a29"/>
  <path d="m49 829 9-8 9 8m-15-2v9h12v-9" class="icon"/>
  <text x="58" y="860" text-anchor="middle" font-size="12" fill="#4ade80">Inicio</text>
  <path d="M161 820h8v8h-8zm12 0h8v8h-8zm-12 12h8v8h-8zm12 0h8v8h-8z" stroke="#8ba0b8" fill="none"/>
  <text x="171" y="860" text-anchor="middle" class="muted">Apps</text>
  <path d="M268 820h20v13h-20zm24 5h9v16h-9" stroke="#8ba0b8" fill="none"/>
  <text x="284" y="860" text-anchor="middle" class="muted">Dispositivos</text>
  <circle cx="389" cy="830" r="9" stroke="#8ba0b8" fill="none"/><circle cx="389" cy="830" r="3" stroke="#8ba0b8" fill="none"/>
  <text x="389" y="860" text-anchor="middle" class="muted">Ajustes</text>
 </g>
</defs>
<rect width="1600" height="1400" fill="#eef2f6"/>
<text x="60" y="48" font-size="13" font-weight="700" letter-spacing="2" fill="#15803d">ADB OPTIMIZER / INICIO ORGANIZADO</text>
<text x="60" y="98" font-size="36" font-weight="700" fill="#0f172a">La información correcta, sin una lista interminable.</text>
<text x="60" y="134" font-size="18" fill="#52657a">Tres opciones con la misma identidad visual. Solo propuesta: la app permanece sin cambios.</text>

<!-- Opción 1: pestañas -->
<g transform="translate(60 240)">
 <text y="-32" font-size="22" font-weight="700" fill="#0f172a">01 / Pestañas por categoría</text>
 <use href="#frame"/>
 <text x="24" y="274" class="body">Dispositivo</text><text x="134" y="274" class="body">Sistema</text>
 <text x="228" y="274" font-size="14" font-weight="700" fill="#4ade80">CPU</text><text x="286" y="274" class="body">Batería</text><text x="356" y="274" class="body">Memoria</text>
 <path d="M24 296h392" class="line"/><rect x="214" y="293" width="58" height="3" rx="1.5" fill="#4ade80"/>
 <text x="24" y="340" class="label">PROCESADOR</text>
 <rect x="24" y="360" width="392" height="148" rx="20" fill="#17212e"/>
 <text x="44" y="394" class="body">CPU en uso</text><text x="44" y="448" class="value">18%</text>
 <use href="#chip" x="351" y="390" class="icon"/>
 <rect x="44" y="472" width="352" height="6" rx="3" fill="#2a3847"/><rect x="44" y="472" width="64" height="6" rx="3" fill="#4ade80"/>
 <rect x="24" y="524" width="392" height="196" rx="20" fill="#141e29"/>
 <text x="44" y="560" class="muted">Arquitectura</text><text x="396" y="560" text-anchor="end" class="title">arm64-v8a</text>
 <path d="M44 582h352" class="line"/>
 <text x="44" y="612" class="muted">Carga del sistema</text><text x="396" y="612" text-anchor="end" class="title">0.42</text>
 <path d="M44 634h352" class="line"/>
 <text x="44" y="664" class="muted">Procesos en segundo plano</text><text x="396" y="664" text-anchor="end" class="title">18</text>
 <text x="44" y="698" class="muted">Solo ves los datos de la categoría elegida.</text>
 <text x="24" y="760" class="muted">Actualizado hace unos segundos</text>
 <text y="930" font-size="18" font-weight="700" fill="#0f172a">La más cercana a lo que pides.</text>
 <text y="962" class="note">Cinco pestañas y un contenido a la vez.</text>
 <text y="990" class="note">En pantallas pequeñas, las pestañas deslizan.</text>
 <text y="1018" class="note">Ideal para consultar detalles sin distracciones.</text>
</g>

<!-- Opción 2: resumen + categorías -->
<g transform="translate(580 240)">
 <text y="-32" font-size="22" font-weight="700" fill="#0f172a">02 / Resumen + categorías</text>
 <rect x="310" y="-54" width="130" height="25" rx="12" fill="#d8f4e2"/><text x="375" y="-37" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">RECOMENDADA</text>
 <use href="#frame"/>
 <text x="24" y="262" class="label">DE UN VISTAZO</text>
 <rect x="24" y="282" width="188" height="112" rx="20" fill="#17212e"/><text x="44" y="314" class="body">Batería</text><text x="44" y="356" class="value">78%</text><text x="44" y="379" class="muted">Nivel actual</text>
 <rect x="228" y="282" width="188" height="112" rx="20" fill="#17212e"/><text x="248" y="314" class="body">RAM en uso</text><text x="248" y="356" class="value">3.2 GB</text><text x="248" y="379" class="muted">de 8 GB</text>
 <text x="24" y="438" class="label">EXPLORA TU EQUIPO</text>
 <rect x="24" y="458" width="392" height="298" rx="20" fill="#141e29"/>
 <use href="#phone" x="44" y="475" class="icon"/><text x="92" y="488" class="title">Dispositivo</text><text x="92" y="508" class="muted">Modelo, fabricante y tipo de equipo</text><use href="#chevron" x="390" y="480" class="icon"/>
 <path d="M44 518h352" class="line"/>
 <use href="#system" x="38" y="531" class="icon"/><text x="92" y="548" class="title">Sistema</text><text x="92" y="568" class="muted">Android 16 · SDK 36</text><use href="#chevron" x="390" y="540" class="icon"/>
 <path d="M44 578h352" class="line"/>
 <use href="#chip" x="38" y="591" class="icon"/><text x="92" y="608" class="title">CPU</text><text x="92" y="628" class="muted">18% en uso · arm64-v8a</text><use href="#chevron" x="390" y="600" class="icon"/>
 <path d="M44 638h352" class="line"/>
 <use href="#battery" x="38" y="651" class="icon"/><text x="92" y="668" class="title">Batería</text><text x="92" y="688" class="muted">78% de carga</text><use href="#chevron" x="390" y="660" class="icon"/>
 <path d="M44 698h352" class="line"/>
 <use href="#memory" x="38" y="711" class="icon"/><text x="92" y="728" class="title">Memoria</text><text x="92" y="748" class="muted">RAM y almacenamiento</text><use href="#chevron" x="390" y="720" class="icon"/>
 <text y="930" font-size="18" font-weight="700" fill="#0f172a">Un Inicio útil antes de entrar al detalle.</text>
 <text y="962" class="note">Resumen breve y cinco accesos claros.</text>
 <text y="990" class="note">Cada categoría abre su vista con botón Atrás.</text>
 <text y="1018" class="note">Ideal para equilibrar lectura rápida y detalle.</text>
</g>

<!-- Opción 3: acordeón -->
<g transform="translate(1100 240)">
 <text y="-32" font-size="22" font-weight="700" fill="#0f172a">03 / Secciones desplegables</text>
 <use href="#frame"/>
 <text x="24" y="262" class="label">INFORMACIÓN DEL EQUIPO</text>
 <rect x="24" y="282" width="392" height="210" rx="20" fill="#17212e" stroke="#325b42"/>
 <use href="#phone" x="44" y="302" class="icon"/><text x="92" y="326" class="title">Dispositivo</text><use href="#down" x="382" y="315" class="icon"/>
 <path d="M44 346h352" class="line"/>
 <text x="44" y="378" class="muted">Fabricante</text><text x="396" y="378" text-anchor="end" class="body">Samsung</text>
 <text x="44" y="414" class="muted">Modelo</text><text x="396" y="414" text-anchor="end" class="body">SM-A356E</text>
 <text x="44" y="450" class="muted">Destino</text><text x="396" y="450" text-anchor="end" class="body">Este teléfono</text>
 <rect x="24" y="508" width="392" height="56" rx="16" fill="#141e29"/><use href="#system" x="38" y="520" class="icon"/><text x="92" y="542" class="title">Sistema</text><text x="350" y="542" text-anchor="end" class="muted">Android 16</text><use href="#down" x="382" y="532" class="icon"/>
 <rect x="24" y="580" width="392" height="56" rx="16" fill="#141e29"/><use href="#chip" x="38" y="592" class="icon"/><text x="92" y="614" class="title">CPU</text><text x="350" y="614" text-anchor="end" class="muted">18%</text><use href="#down" x="382" y="604" class="icon"/>
 <rect x="24" y="652" width="392" height="56" rx="16" fill="#141e29"/><use href="#battery" x="38" y="664" class="icon"/><text x="92" y="686" class="title">Batería</text><text x="350" y="686" text-anchor="end" class="muted">78%</text><use href="#down" x="382" y="676" class="icon"/>
 <rect x="24" y="724" width="392" height="56" rx="16" fill="#141e29"/><use href="#memory" x="38" y="736" class="icon"/><text x="92" y="758" class="title">Memoria</text><text x="350" y="758" text-anchor="end" class="muted">3.2 / 8 GB</text><use href="#down" x="382" y="748" class="icon"/>
 <text y="930" font-size="18" font-weight="700" fill="#0f172a">Todo en Inicio, con menos ruido.</text>
 <text y="962" class="note">Abres solo la sección que necesitas.</text>
 <text y="990" class="note">Un valor clave sigue visible al cerrarla.</text>
 <text y="1018" class="note">Ideal si prefieres no cambiar de pantalla.</text>
</g>
<rect x="60" y="1314" width="1480" height="60" rx="16" fill="#dfeae3"/>
<text x="84" y="1340" font-size="15" fill="#245438">En las tres opciones: Dispositivo · Sistema · CPU · Batería · Memoria (RAM + almacenamiento).</text>
<text x="84" y="1363" font-size="14" fill="#245438">Datos de ejemplo. Lo no disponible se indica como tal; no se inventan lecturas. Las herramientas remotas aparecen solo cuando corresponden.</text>
</svg>
