<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc">
<title id="title">ADB Optimizer: centro de dispositivos y conexión en dos pasos</title>
<desc id="desc">Tres vistas del mismo flujo: centro de dispositivos, selección de equipo y vinculación. Se elimina la pantalla de preparación y se integra una ayuda breve en el formulario.</desc>
<defs>
 <style>text{font-family:Arial,Helvetica,sans-serif}.heading{font-size:26px;font-weight:700;fill:#e7eef7}.title{font-size:17px;font-weight:700;fill:#e7eef7}.body{font-size:14px;fill:#a5b4c7}.muted{font-size:13px;fill:#8ba0b8}.label{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#4ade80}.cta{font-size:16px;font-weight:700;fill:#052e16}.caption{font-size:14px;fill:#52657a}.line{stroke:#293544;fill:none}.icon{stroke:#4ade80;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
 <g id="tv"><rect width="36" height="24" rx="4"/><path d="M18 24v7m-10 0h20"/></g>
 <g id="phone"><rect width="20" height="34" rx="5"/><path d="M7 29h6"/></g>
 <g id="back"><path d="m8 0-8 8 8 8M0 8h20"/></g>
 <g id="chevron"><path d="m0 0 6 6-6 6"/></g>
 <g id="frame"><rect width="400" height="800" rx="32" fill="#0b0f14" stroke="#263342" stroke-width="2"/><text x="24" y="32" class="body">9:41</text><text x="326" y="32" class="body">● ▰</text><rect x="152" y="780" width="96" height="4" rx="2" fill="#596675"/></g>
</defs>
<rect width="1440" height="1160" fill="#eef2f6"/>
<text x="60" y="48" font-size="13" fill="#15803d" font-weight="700" letter-spacing="2">ADB OPTIMIZER / PROPUESTAS 1 + 2 REFINADAS</text>
<text x="60" y="92" font-size="32" fill="#0f172a" font-weight="700">Tus dispositivos, sin pasos de más.</text>
<text x="60" y="124" font-size="17" fill="#52657a">Centro de dispositivos → elegir equipo → vincular. Sin pantalla intermedia de preparación.</text>

<!-- Vista de entrada: propuesta 2 -->
<g transform="translate(60 192)">
 <text y="-16" font-size="19" fill="#0f172a" font-weight="700">Centro de dispositivos</text>
 <use href="#frame"/>
 <text x="24" y="80" class="label">TU ESPACIO DE TRABAJO</text>
 <text x="24" y="120" class="heading">Dispositivos</text>
 <text x="24" y="150" class="body">Todos tus equipos, en un solo lugar.</text>
 <rect x="24" y="184" width="352" height="96" rx="20" fill="#14271f" stroke="#325b42"/>
 <use href="#phone" x="48" y="212" class="icon"/>
 <text x="88" y="220" class="title">Este teléfono</text>
 <text x="88" y="246" class="body">Destino activo · Local</text>
 <circle cx="348" cy="232" r="5" fill="#4ade80"/>
 <text x="24" y="328" class="label">DISPOSITIVOS REMOTOS</text>
 <rect x="24" y="352" width="352" height="196" rx="20" fill="#141e29"/>
 <circle cx="200" cy="408" r="32" fill="#203331"/>
 <use href="#tv" x="182" y="394" class="icon"/>
 <text x="200" y="474" text-anchor="middle" class="title">Tu próximo equipo, aquí</text>
 <text x="200" y="504" text-anchor="middle" class="body">Conecta una TV, un teléfono o una tablet.</text>
 <rect x="24" y="572" width="352" height="56" rx="16" fill="#4ade80"/>
 <text x="200" y="606" text-anchor="middle" class="cta">+ Conectar equipo</text>
 <text x="24" y="680" class="title">Vinculados anteriormente</text>
 <text x="24" y="710" class="muted">Tus equipos recientes aparecerán aquí.</text>
 <text y="840" font-size="16" fill="#0f172a" font-weight="700">La organización de la propuesta 2.</text>
 <text y="866" class="caption">Local, remotos y recientes, sin mezclar acciones.</text>
</g>

<!-- Paso 1: selección directa, sin botón Continuar -->
<g transform="translate(520 192)">
 <text y="-16" font-size="19" fill="#0f172a" font-weight="700">1 / Elige tu equipo</text>
 <use href="#frame"/>
 <use href="#back" x="24" y="64" class="icon"/>
 <text x="64" y="80" class="title">Nuevo dispositivo</text>
 <text x="352" y="80" text-anchor="middle" class="body">?</text>
 <rect x="24" y="108" width="172" height="4" rx="2" fill="#4ade80"/>
 <rect x="204" y="108" width="172" height="4" rx="2" fill="#253140"/>
 <text x="24" y="150" class="label">PASO 1 DE 2 · EQUIPO</text>
 <text x="24" y="196" class="heading">¿Qué quieres conectar?</text>
 <text x="24" y="226" class="body">Toca un equipo para empezar a vincular.</text>
 <rect x="24" y="264" width="352" height="112" rx="20" fill="#17212e" stroke="#2d3e4e"/>
 <rect x="44" y="292" width="56" height="56" rx="16" fill="#203331"/>
 <use href="#tv" x="54" y="306" class="icon"/>
 <text x="116" y="310" class="title">Android TV / TV Box</text>
 <text x="116" y="338" class="body">Vincular con código</text>
 <use href="#chevron" x="352" y="314" class="icon"/>
 <rect x="24" y="392" width="352" height="112" rx="20" fill="#17212e" stroke="#2d3e4e"/>
 <rect x="44" y="420" width="56" height="56" rx="16" fill="#203331"/>
 <use href="#phone" x="62" y="432" class="icon"/>
 <text x="116" y="438" class="title">Teléfono o tablet</text>
 <text x="116" y="466" class="body">Vincular con QR</text>
 <use href="#chevron" x="352" y="442" class="icon"/>
 <path d="M24 544h352" class="line"/>
 <text x="24" y="580" class="title">¿Ya está vinculado?</text>
 <text x="24" y="618" class="body">Buscar en mi red</text>
 <use href="#chevron" x="352" y="606" class="icon"/>
 <text x="24" y="680" class="muted">Opciones avanzadas</text>
 <text x="24" y="718" class="body">Conectar por dirección IP</text>
 <use href="#chevron" x="352" y="706" class="icon"/>
 <text y="840" font-size="16" fill="#0f172a" font-weight="700">Un toque reemplaza «Continuar».</text>
 <text y="866" class="caption">La tarjeta abre directamente código o QR.</text>
</g>

<!-- Paso 2: ejemplo TV; preparación integrada en el formulario -->
<g transform="translate(980 192)">
 <text y="-16" font-size="19" fill="#0f172a" font-weight="700">2 / Vincula y conecta</text>
 <use href="#frame"/>
 <use href="#back" x="24" y="64" class="icon"/>
 <text x="64" y="80" class="title">Vincular TV / TV Box</text>
 <text x="352" y="80" text-anchor="middle" class="body">?</text>
 <rect x="24" y="108" width="172" height="4" rx="2" fill="#4ade80"/>
 <rect x="204" y="108" width="172" height="4" rx="2" fill="#4ade80"/>
 <text x="24" y="150" class="label">PASO 2 DE 2 · VINCULACIÓN</text>
 <text x="24" y="196" class="heading">Introduce el código.</text>
 <rect x="24" y="224" width="352" height="112" rx="16" fill="#17212e"/>
 <text x="40" y="252" class="title">En tu TV</text>
 <text x="40" y="278" class="body">Depuración inalámbrica → Vincular con código.</text>
 <text x="40" y="302" class="muted">Ambos equipos deben usar la misma Wi-Fi.</text>
 <text x="40" y="324" font-size="13" fill="#4ade80">Ver cómo activarlo ↗</text>
 <text x="24" y="372" class="body">IP del equipo</text>
 <rect x="24" y="384" width="352" height="56" rx="12" fill="#111a24" stroke="#3f5063"/>
 <text x="40" y="418" class="muted">Ej. 192.168.1.40</text>
 <text x="24" y="472" class="body">Puerto de vinculación</text>
 <rect x="24" y="484" width="352" height="56" rx="12" fill="#111a24" stroke="#3f5063"/>
 <text x="40" y="518" class="muted">Ej. 41021</text>
 <text x="24" y="572" class="body">Código de 6 dígitos</text>
 <rect x="24" y="584" width="352" height="56" rx="12" fill="#111a24" stroke="#3f5063"/>
 <text x="40" y="618" class="muted" letter-spacing="8">0 0 0 0 0 0</text>
 <text x="24" y="678" class="body">+ Añadir puerto de conexión (opcional)</text>
 <rect x="24" y="708" width="352" height="56" rx="16" fill="#4ade80"/>
 <text x="200" y="742" text-anchor="middle" class="cta">Vincular y conectar</text>
 <text y="840" font-size="16" fill="#0f172a" font-weight="700">Preparación integrada, no otra pantalla.</text>
 <text y="866" class="caption">QR usa esta misma estructura, sin formulario.</text>
</g>
<path d="M472 620h32m-8-6 8 6-8 6M932 620h32m-8-6 8 6-8 6" stroke="#15803d" stroke-width="2" fill="none"/>
<rect x="60" y="1092" width="1320" height="40" rx="12" fill="#dfeae3"/>
<text x="80" y="1117" font-size="14" fill="#245438">Atrás: vinculación → elegir equipo → dispositivos. Ayuda bajo demanda, sin pasos obligatorios. Solo propuesta SVG; app sin cambios.</text>
</svg>
